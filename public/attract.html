<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>wadalab-motion</title>
 <link rel="icon" href="data:,">
 <style>html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden;color:#111}canvas{display:block;width:100%;height:100%;cursor:none}</style>
</head>
<body>
 <!-- 待機画面。Wadamotion-4 の動きで、夢十夜の代わりに説明文を流す。 -->
 <canvas role="img" aria-label="これは和田研フォントの骨格データを使用したフォントモーションプロジェクトの試作です。自由にキーボードを操作して試し打ちすることができます。"></canvas>
 <script>
  const story = {
   title: 'wadalab-motion',
   phrases: [
    'これは和田研フォントの骨格データを使用したフォントモーションプロジェクトの試作です。',
    '自由にキーボードを操作して試し打ちすることができます。',
   ],
  };
  // 離れて見る展示なので等倍で描く。Retina だとキャンバスと文字の画像が 4 倍になり、長時間で重くなる。
  Object.defineProperty(window, 'devicePixelRatio', { get: () => 1 });
  // 親ページは iframe を作り直さず、見えない間はこれで描画ループを止める。
  // 作り直すと文字データ（約 9MB）の解析をやり直して、画面全体が固まる。
  let paused = false, queued = [];
  const frame = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = callback => paused ? (queued.push(callback), 0) : frame(callback);
  window.setPaused = next => {
   paused = next;
   if (!paused) { const callbacks = queued; queued = []; callbacks.forEach(frame); }
  };
  // 試し打ちの iframe が読み込み済みの字形データ（約 9MB）を借りる。
  // 二重に持つとメモリが倍になり、ガベージコレクションで一瞬止まるのが増える。
  async function sharedGlyphs() {
   const typing = parent.document.querySelector('.typing')?.contentWindow;
   const version = typing?.document.querySelector('script[src*="/app.js"]')?.src.split('?')[1];
   if (!version) return null;
   const { getSourceEngine } = await typing.eval(`import('/workspace/wadalab-motion/source-engine.js?${version}')`);
   for (let i = 0; i < 100 && !getSourceEngine(); i++) await new Promise(resolve => setTimeout(resolve, 100));
   const engine = getSourceEngine();
   return engine && [...engine.glyphs].map(([text, skeleton]) => [text, skeleton, engine.definitions.get(text)]);
  }
  // motion-4.js は night-one.json を読むので、その応答だけ差し替える。
  const load = window.fetch.bind(window);
  window.fetch = async (input, init) => {
   const url = String(input);
   if (url.endsWith('/night-one.json')) return new Response(JSON.stringify(story), { headers: { 'Content-Type': 'application/json' } });
   if (url.endsWith('/source-glyphs.json')) {
    const glyphs = await sharedGlyphs().catch(() => null);
    if (glyphs) return { ok: true, status: 200, json: async () => glyphs };
   }
   return load(input, init);
  };
 </script>
 <script type="module" src="/workspace/wadalab-motion/motion-4.js"></script>
</body>
</html>
