 <title>wadalab-motion — 芸祭2026</title>

 <style>
  /* 21:9 の展示画面用。左 5/21 に説明、右 16/21 で試打と説明（Wadamotion-4 の動き）を切り替える。 */
  @font-face { font-family: Wadalab; src: url('/workspace/wadalab-motion/font/wlmaru2004emoji.ttf') format('truetype'); font-display: swap; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; background: #fff; color: #111; cursor: none; }
  .frame {
   position: absolute; inset: 0; margin: auto;
   width: min(100vw, calc(100vh * 21 / 9)); height: min(100vh, calc(100vw * 9 / 21));
   display: grid; grid-template-columns: 5fr 16fr; container-type: size;
  }
  .panel {
   display: flex; flex-direction: column; gap: 3.2cqh; min-width: 0;
   padding: 6cqh 4.4cqh 5cqh; border-right: 1px solid #ddd;
   font: 2.1cqh/1.75 Wadalab, sans-serif; letter-spacing: .03em;
  }
  h1 { margin: 0; font-size: 3.6cqh; line-height: 1.45; font-weight: normal; }
  .hint { margin: 0; padding-left: 1.2cqh; border-left: 2px solid #111; }
  .frame[data-mode="attract"] .hint-typing,
  .frame[data-mode="typing"] .hint-attract { display: none; }
  .qrs { margin: auto 0 0; display: flex; gap: 3cqh; }
  .qr { margin: 0; display: flex; flex-direction: column; gap: 1.2cqh; }
  .qr-code { width: 15cqh; }
  .qr-code svg { display: block; width: 100%; height: auto; }
  figcaption { font-size: 1.7cqh; }
  .credit { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .3cqh 1.4cqh; color: #777; font-size: 1.25cqh; line-height: 1.6; }
  .credit dt, .credit dd { margin: 0; }
  .credit dd { overflow-wrap: anywhere; }
  .stage { position: relative; overflow: hidden; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .attract { pointer-events: none; opacity: 0; transition: opacity .8s; }
  .attract.is-visible { opacity: 1; }
  .idle-trash { position: absolute; z-index: 1; right: 3cqh; bottom: 3cqh; width: 7cqh; height: 7cqh; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .4s; pointer-events: none; }
  .idle-trash.is-visible { opacity: 1; }
  .idle-trash .track { stroke: #e5e5e5; stroke-width: 2; }
  .idle-trash .ring { stroke: #111; stroke-width: 2; transform: rotate(-90deg); transform-origin: center; }
  .idle-trash .icon { stroke: #111; stroke-width: 1.6; }
 </style>

 <script>
  (() => {
   const params = new URLSearchParams(location.search);
   // 最後の入力からこの秒数で説明の画面に戻す。?idle=10 で調整できる。
   // 右下のゴミ箱は graceSeconds 後に出て、残りの時間で周りの円が一周する。
   const idleSeconds = Number(params.get('idle')) || 30, graceSeconds = Math.min(3, idleSeconds / 3);
   const frame = document.querySelector('.frame');
   const stage = frame.querySelector('.stage'), typing = frame.querySelector('.typing');
   const trash = frame.querySelector('.idle-trash'), ring = trash.querySelector('.ring'), ringLength = ring.getTotalLength();
   ring.style.strokeDasharray = ringLength;
   let mode = 'attract', lastInput = 0, attract = null, input = null, attractTimer = 0;

   const setMode = next => { mode = next; frame.dataset.mode = next; };
   const focusInput = () => {
    if (!input || input.ownerDocument.querySelector('dialog[open]')) return;
    typing.contentWindow.focus();
    input.focus({ preventScroll: true });
   };

   // 説明の iframe は一度だけ読み込み、あとは表示と一時停止を切り替える。
   let attractReady = false, attractVisible = false, pauseTimer = 0;
   function showAttract() {
    attractVisible = true;
    if (!attract) {
     attract = document.createElement('iframe');
     attract.className = 'attract';
     attract.title = 'wadalab-motion の説明';
     attract.tabIndex = -1;
     attract.src = '/attract.html';
     attract.addEventListener('load', () => {
      attractReady = true;
      if (attractVisible) showAttract(); else attract.contentWindow.setPaused?.(true);
      focusInput();
     }, { once: true });
     stage.append(attract);
     return;
    }
    if (!attractReady) return;
    clearTimeout(pauseTimer);
    attract.contentWindow.setPaused?.(false);
    requestAnimationFrame(() => attract.classList.add('is-visible'));
   }

   function hideAttract() {
    clearTimeout(attractTimer);
    attractVisible = false;
    if (!attract) return;
    attract.classList.remove('is-visible');
    clearTimeout(pauseTimer);
    // フェードアウトが終わってから止める。
    pauseTimer = setTimeout(() => { if (!attractVisible) attract.contentWindow.setPaused?.(true); }, 800);
   }

   function enterAttract() {
    setMode('attract');
    // 打たれた文字を消すアニメーションを見せてから切り替える。
    if (input.value) {
     clearText();
     attractTimer = setTimeout(showAttract, 1800);
    } else showAttract();
   }

   // 卑猥語と暴言は server.mjs 経由で Clef-flash に判定させ、打たれてから 3 秒以内に全文を消す。
   let checkTimer = 0, checking = '';
   function clearText() {
    input.value = '';
    input.dispatchEvent(new InputEvent('input', { inputType: 'deleteContentBackward' }));
   }
   function scheduleCheck() {
    clearTimeout(checkTimer);
    checkTimer = setTimeout(async () => {
     const text = input.value;
     if (!text.trim() || text === checking) return;
     checking = text;
     try {
      const response = await fetch('/api/moderate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      if (!response.ok) return;
      const { flagged } = await response.json();
      if (flagged && input.value.startsWith(text)) clearText();
     } catch { /* 回線が切れても展示は続ける。 */ }
     finally { if (checking === text) checking = ''; }
    }, 400);
   }

   function activity() {
    lastInput = performance.now();
    if (mode === 'attract') { setMode('typing'); hideAttract(); }
   }

   typing.addEventListener('load', () => {
    const doc = typing.contentDocument;
    const style = doc.createElement('style');
    style.textContent = '#paste,#info{display:none!important}body{cursor:none}';
    doc.head.append(style);
    input = doc.getElementById('input');
    for (const type of ['keydown', 'compositionstart', 'input']) input.addEventListener(type, event => { if (event.isTrusted) activity(); });
    input.addEventListener('input', event => { if (event.isTrusted && !event.isComposing) scheduleCheck(); });
    input.addEventListener('compositionend', scheduleCheck);
    focusInput();
    showAttract();
   });

   // 展示中にフォーカスが外れても、次のキー入力を取りこぼさないようにする。
   document.addEventListener('pointerdown', () => setTimeout(focusInput));
   addEventListener('focus', focusInput);
   setInterval(() => {
    if (input && typing.contentDocument.activeElement !== input) focusInput();
   }, 1000);

   function tick(now) {
    const idle = (now - lastInput) / 1000;
    const progress = mode === 'typing' ? Math.max(0, (idle - graceSeconds) / (idleSeconds - graceSeconds)) : 0;
    trash.classList.toggle('is-visible', progress > 0);
    if (progress > 0) ring.style.strokeDashoffset = ringLength * (1 - Math.min(1, progress));
    // 円が一周したら、打たれた文字がほどけて説明の画面に変わる。
    if (progress >= 1) enterAttract();
    requestAnimationFrame(tick);
   }
   requestAnimationFrame(tick);
  })();
 </script>
